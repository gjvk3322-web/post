<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>우리 회사 익명 신문고 & 포스트잇</title>
    <style>
        body {
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            background-color: #e9ecef; 
            margin: 0; padding: 20px;
            color: #333;
            overflow-x: hidden;
        }
        .header { text-align: center; margin-bottom: 20px; }
        
        /* 이벤트 게이지 스타일 */
        .event-container {
            max-width: 800px; margin: 0 auto 30px auto;
            background: white; padding: 15px 20px;
            border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        .event-title { font-weight: bold; font-size: 18px; margin-bottom: 10px; color: #e03131; }
        .progress-bg {
            background-color: #f1f3f5; border-radius: 10px;
            height: 25px; width: 100%; overflow: hidden;
            position: relative; box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }
        .progress-bar {
            height: 100%; width: 0%; 
            background: linear-gradient(90deg, #ff8787, #e03131);
            transition: width 0.5s ease-out;
        }
        .progress-text {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: bold; color: #333;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }

        /* 📌 겹쳐지는 보드 스타일 (무조건 가로 4개) */
        .board {
            display: flex; flex-wrap: wrap; justify-content: flex-start;
            max-width: 1000px; margin: 0 auto 30px auto;
            padding: 20px 10px;
        }
        
        .post-it {
            width: calc(25% - 10px); margin: -15px 5px; 
            min-height: 140px; 
            box-shadow: 2px 4px 8px rgba(0,0,0,0.2);
            font-size: 14px; line-height: 1.4; word-break: keep-all;
            position: relative; box-sizing: border-box;
            background-color: white; z-index: 1;
            transition: transform 0.3s ease, z-index 0s, box-shadow 0.3s ease;
        }

        .post-it:hover, .post-it:active {
            z-index: 100; 
            transform: scale(1.15) rotate(0deg) !important; 
            box-shadow: 5px 15px 25px rgba(0,0,0,0.3);
        }

        .post-it:nth-child(even) { transform: rotate(3deg); }
        .post-it:nth-child(3n) { transform: rotate(-2deg); }
        .post-it:nth-child(5n) { transform: rotate(1deg); }

        .post-it-header {
            width: 100%; height: 25px; padding: 0 5px;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: bold; color: white;
            box-sizing: border-box; text-align: center; letter-spacing: -0.5px;
        }
        .post-it-body { padding: 15px 10px; }
        
        .bg-blue { background-color: #74c0fc; } .bg-blue-body { background-color: #d0ebff; }
        .bg-yellow { background-color: #fcc419; } .bg-yellow-body { background-color: #fff3bf; }
        .bg-red { background-color: #ffa8a8; } .bg-red-body { background-color: #ffe3e3; }
        
        .date { font-size: 10px; color: #666; position: absolute; bottom: 8px; right: 10px; }

        /* 입력창 및 카테고리 버튼 스타일 */
        .input-section {
            background: white; max-width: 600px; margin: 0 auto 50px auto;
            padding: 20px; border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* 💡 수정된 부분: 드롭다운 대신 터치하기 편한 버튼 그룹으로 변경 */
        .category-selector {
            display: flex; gap: 10px; margin-bottom: 15px;
        }
        .cat-btn {
            flex: 1; padding: 12px 5px; border: 2px solid transparent; border-radius: 8px;
            background-color: #f1f3f5; color: #888; font-size: 14px; font-weight: bold;
            cursor: pointer; transition: all 0.2s; text-align: center;
            /* 터치 시 하이라이트 깜빡임 방지 */
            -webkit-tap-highlight-color: transparent; 
        }
        /* 선택된 버튼 디자인 */
        .cat-btn.active[data-color="bg-blue"] { background-color: #d0ebff; border-color: #74c0fc; color: #333; }
        .cat-btn.active[data-color="bg-yellow"] { background-color: #fff3bf; border-color: #fcc419; color: #333; }
        .cat-btn.active[data-color="bg-red"] { background-color: #ffe3e3; border-color: #ffa8a8; color: #333; }

        textarea {
            width: 100%; height: 90px; padding: 15px; border: 1px solid #ddd;
            border-radius: 8px; box-sizing: border-box; resize: none; margin-bottom: 15px;
            /* 💡 수정된 부분: 16px 이상이어야 아이폰에서 자동 확대가 안 됨 */
            font-size: 16px; 
            font-family: inherit;
        }
        textarea:focus { outline: none; border-color: #aaa; }
        
        .submit-btn { 
            width: 100%; padding: 15px; border-radius: 8px; border: none;
            background-color: #333; color: white; cursor: pointer; font-size: 16px; font-weight: bold;
        }
        .submit-btn:hover { background-color: #555; }

        /* 📱 모바일 화면 최적화 */
        @media screen and (max-width: 600px) {
            .post-it { width: calc(25% - 4px); margin: -10px 2px; min-height: 100px; font-size: 11px; }
            .post-it-header { font-size: 9px; padding: 0 2px; }
            .post-it-body { padding: 10px 5px; }
            .date { font-size: 8px; bottom: 4px; right: 5px; }
            
            .input-section { margin: 15px; padding: 15px; }
            .cat-btn { font-size: 12px; padding: 10px 2px; letter-spacing: -0.5px; } /* 모바일용 버튼 크기 조정 */
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🗣️ 익명 포스트잇 보드</h1>
        <p>우리 회사의 강점, 약점, 시급한 문제점을 자유롭게 적어주세요!</p>
    </div>

    <div class="event-container">
        <div class="event-title">🔥 포스트잇 500개 달성 시 특별 이벤트 진행! 🔥</div>
        <div class="progress-bg">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-text" id="progressText">현재 데이터를 불러오는 중...</div>
        </div>
    </div>

    <div class="board" id="board">
        </div>

    <div class="input-section">
        <div class="category-selector" id="categorySelector">
            <button type="button" class="cat-btn active" data-color="bg-blue">📘 강점</button>
            <button type="button" class="cat-btn" data-color="bg-yellow">📒 약점</button>
            <button type="button" class="cat-btn" data-color="bg-red">📕 문제점</button>
        </div>

        <textarea id="memoInput" placeholder="여기에 의견을 자유롭게 적어주세요 (익명 보장!)"></textarea>
        <button id="submitBtn" class="submit-btn">포스트잇 붙이기</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } 
        from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 👇👇👇 여기에 대표님의 파이어베이스 정보를 덮어써주세요! 👇👇👇
        const firebaseConfig = {
  apiKey: "AIzaSyAjVerxCunFEIvkNfCOTDnedbO5YRVOma4",
  authDomain: "dolbomnote-be438.firebaseapp.com",
  projectId: "dolbomnote-be438",
  storageBucket: "dolbomnote-be438.firebasestorage.app",
  messagingSenderId: "772276336020",
  appId: "1:772276336020:web:b4f2d5659406d813350b81",
  measurementId: "G-232HEJ5RKM"
        };
        // 👆👆👆 ========================================================= 👆👆👆

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const postItsCollection = collection(db, "postits");

        // 💡 수정된 부분: 선택된 카테고리를 저장할 변수 (기본값: 파란색/강점)
        let selectedCategory = 'bg-blue';

        // 💡 카테고리 버튼 클릭 이벤트 처리
        const catButtons = document.querySelectorAll('.cat-btn');
        catButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                // 1. 모든 버튼에서 색상(active) 빼기
                catButtons.forEach(b => b.classList.remove('active'));
                // 2. 지금 누른 버튼에만 색상(active) 넣기
                e.currentTarget.classList.add('active');
                // 3. 선택된 색상 값 저장
                selectedCategory = e.currentTarget.getAttribute('data-color');
            });
        });

        function getCategoryName(colorClass) {
            if (colorClass === 'bg-blue') return '우리 회사의 강점';
            if (colorClass === 'bg-yellow') return '보완해야 할 약점';
            if (colorClass === 'bg-red') return '시급하게 뜯어고칠 문제점';
            return '익명 의견';
        }

        // [기능 1] 포스트잇 추가하기
        document.getElementById('submitBtn').addEventListener('click', async () => {
            const textInput = document.getElementById('memoInput');
            const text = textInput.value.trim();

            if (!text) {
                alert("내용을 입력해주세요!");
                return;
            }

            // 버튼 클릭 안되게 잠시 막기 (연속 클릭 방지)
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "저장 중...";

            try {
                await addDoc(postItsCollection, {
                    content: text,
                    color: selectedCategory, // 💡 드롭다운 대신 버튼에서 선택한 변수 사용
                    date: new Date().toLocaleDateString(),
                    timestamp: Date.now()
                });
                textInput.value = ''; 
            } catch(e) {
                alert("오류가 발생했습니다. 다시 시도해주세요.");
            } finally {
                // 버튼 다시 활성화
                submitBtn.disabled = false;
                submitBtn.innerText = "포스트잇 붙이기";
            }
        });

        // [기능 2] 실시간 그리기 + 게이지 업데이트
        const q = query(postItsCollection, orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            const board = document.getElementById('board');
            board.innerHTML = ''; 

            const totalCount = snapshot.size; 
            const targetCount = 500; 
            const percent = Math.min((totalCount / targetCount) * 100, 100); 

            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressText').innerText = `현재 ${totalCount}개 작성 완료! (${Math.floor(percent)}%) - 목표까지 ${targetCount - totalCount}개 남았습니다!`;

            snapshot.forEach((firebaseDoc) => {
                const data = firebaseDoc.data();
                const safeText = data.content.replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, '<br>');
                const categoryName = getCategoryName(data.color);

                const postItHTML = `
                    <div class="post-it ${data.color}-body">
                        <div class="post-it-header ${data.color}">${categoryName}</div>
                        <div class="post-it-body">${safeText}</div>
                        <div class="date">${data.date}</div>
                    </div>
                `;
                board.insertAdjacentHTML('beforeend', postItHTML);
            });
        });
    </script>
</body>
</html>
