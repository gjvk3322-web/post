<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 회사 익명 신문고 & 포스트잇</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        body {
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            background-color: #e9ecef; 
            margin: 0; padding: 20px;
            color: #333;
            overflow-x: hidden; /* 모바일 스와이프 시 가로 스크롤 방지 */
        }
        .header { text-align: center; margin-bottom: 30px; }
        .input-section {
            background: white; max-width: 600px; margin: 30px auto;
            padding: 20px; border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        textarea {
            width: 100%; height: 80px; padding: 10px; border: 1px solid #ddd;
            border-radius: 5px; box-sizing: border-box; resize: none; margin-bottom: 15px;
        }
        .controls { display: flex; justify-content: space-between; align-items: center; }
        select, button { padding: 10px 15px; border-radius: 5px; border: 1px solid #ccc; font-weight: bold; }
        button { background-color: #333; color: white; cursor: pointer; border: none; }
        button:hover { background-color: #555; }
        
        /* 💻 PC용 그리드 보드 영역 */
        .board {
            display: flex; flex-wrap: wrap; gap: 20px; justify-content: center;
            max-width: 1000px; margin: 0 auto;
        }
        
        /* 📱 모바일용 스와이프 보드 영역 (기본 숨김) */
        .swiper {
            width: 100%; max-width: 400px; height: auto;
            display: none; margin: 0 auto;
        }
        
        /* 포스트잇 기본 공통 스타일 */
        .post-it, .swiper-slide {
            width: 200px; min-height: 150px; 
            box-shadow: 3px 5px 10px rgba(0,0,0,0.15);
            font-size: 15px; line-height: 1.4; word-break: keep-all;
            position: relative;
            box-sizing: border-box;
            background-color: white; /* 기본 배경 */
        }

        /* 💡 카테고리 띠지 디자인 업그레이드 */
        .post-it-header {
            width: 100%; height: 25px; padding: 0 10px;
            display: flex; align-items: center;
            font-size: 12px; font-weight: bold; color: white;
            box-sizing: border-box;
            border-top-left-radius: 2px; border-top-right-radius: 2px;
        }
        .post-it-body { padding: 15px; }

        /* PC용 회전 효과 */
        .post-it { transform: rotate(-2deg); }
        .post-it:nth-child(even) { transform: rotate(2deg); }
        .post-it:nth-child(3n) { transform: rotate(-1deg); }

        /* 카테고리별 색상 (띠지 및 배경) */
        .bg-blue { background-color: #74c0fc; } /* 장점 띠지 */
        .bg-blue-body { background-color: #d0ebff; } /* 장점 배경 */
        
        .bg-yellow { background-color: #fcc419; } /* 약점 띠지 */
        .bg-yellow-body { background-color: #fff3bf; } /* 약점 배경 */
        
        .bg-red { background-color: #ffa8a8; } /* 문제점 띠지 */
        .bg-red-body { background-color: #ffe3e3; } /* 문제점 배경 */
        
        .date { font-size: 11px; color: #666; position: absolute; bottom: 10px; right: 10px; }

        /* 📱 모바일 화면 최적화 (스와이프 활성화) */
        @media screen and (max-width: 600px) {
            .board { display: none; } /* PC 그리드 숨김 */
            .swiper { display: block; } /* 모바일 스와이프 표시 */
            
            .swiper-slide {
                width: 100% !important; height: auto !important; 
                transform: rotate(0deg) !important; /* 모바일은 회전 없음 */
                margin-top: 10px;
                box-shadow: none; /* 스와이프 자체에 섀도우를 줌 */
            }
            .input-section { margin: 15px; padding: 15px; }
            .controls { flex-direction: column; gap: 10px; }
            select, button { width: 100%; box-sizing: border-box; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🗣️ 익명 포스트잇 보드</h1>
        <p>우리 회사의 강점, 약점, 그리고 시급한 문제점을 눈치 보지 말고 솔직하게 적어주세요!</p>
    </div>

    <div class="board" id="board">
        </div>

    <div class="swiper" id="swiperBoard">
        <div class="swiper-wrapper" id="swiperWrapper">
            </div>
        <div class="swiper-pagination"></div>
    </div>

    <div class="input-section">
        <textarea id="memoInput" placeholder="여기에 의견을 자유롭게 적어주세요 (익명 보장!)"></textarea>
        <div class="controls">
            <select id="colorSelect">
                <option value="bg-blue">📘 우리 회사의 강점</option>
                <option value="bg-yellow">📒 보완해야 할 약점</option>
                <option value="bg-red">📕 시급하게 뜯어고칠 문제점</option>
            </select>
            <button id="submitBtn">포스트잇 붙이기</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } 
        from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 👇👇👇 여기에 대표님의 파이어베이스 정보를 덮어써주세요! 👇👇👇
        const firebaseConfig = {
  apiKey: "AIzaSyAjVerxCunFEIvkNfCOTDnedbO5YRVOma4",
  authDomain: "dolbomnote-be438.firebaseapp.com",
  projectId: "dolbomnote-be438",
  storageBucket: "dolbomnote-be438.firebasestorage.app",
  messagingSenderId: "772276336020",
  appId: "1:772276336020:web:b4f2d5659406d813350b81",
  measurementId: "G-232HEJ5RKM"
        };
        // 👆👆👆 ========================================================= 👆👆👆

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const postItsCollection = collection(db, "postits");

        // 카테고리명 매핑 함수
        function getCategoryName(colorClass) {
            if (colorClass === 'bg-blue') return '우리 회사의 강점 📘';
            if (colorClass === 'bg-yellow') return '보완해야 할 약점 📒';
            if (colorClass === 'bg-red') return '시급하게 뜯어고칠 문제점 📕';
            return '익명 의견';
        }

        // [기능 1] 포스트잇 추가하기
        document.getElementById('submitBtn').addEventListener('click', async () => {
            const textInput = document.getElementById('memoInput');
            const colorClass = document.getElementById('colorSelect').value;
            const text = textInput.value.trim();

            if (!text) {
                alert("내용을 입력해주세요!");
                return;
            }

            await addDoc(postItsCollection, {
                content: text,
                color: colorClass,
                date: new Date().toLocaleDateString(),
                timestamp: Date.now()
            });

            textInput.value = ''; 
        });

        // [기능 2] 화면에 포스트잇 실시간 그리기 (PC/모바일 대응)
        const q = query(postItsCollection, orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            const board = document.getElementById('board');
            const swiperWrapper = document.getElementById('swiperWrapper');
            board.innerHTML = ''; 
            swiperWrapper.innerHTML = '';

            snapshot.forEach((firebaseDoc) => {
                const data = firebaseDoc.data();
                const safeText = data.content.replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, '<br>');
                const categoryName = getCategoryName(data.color);

                // 💻 PC용 그리드 포스트잇 HTML
                const pcPostItHTML = `
                    <div class="post-it ${data.color}-body">
                        <div class="post-it-header ${data.color}">${categoryName}</div>
                        <div class="post-it-body">${safeText}</div>
                        <div class="date">${data.date}</div>
                    </div>
                `;
                board.insertAdjacentHTML('beforeend', pcPostItHTML);

                // 📱 모바일용 스와이프 카드 HTML
                const mobilePostItHTML = `
                    <div class="swiper-slide ${data.color}-body">
                        <div class="post-it-header ${data.color}">${categoryName}</div>
                        <div class="post-it-body">${safeText}</div>
                        <div class="date">${data.date}</div>
                    </div>
                `;
                swiperWrapper.insertAdjacentHTML('beforeend', mobilePostItHTML);
            });
            
            // 데이터 로드 후 스와이프 업데이트 (Swiper.js 초기화 필요)
            initializeSwiper();
        });

        // Swiper.js 초기화 함수
        let mySwiper = null;
        function initializeSwiper() {
            if (mySwiper) {
                mySwiper.destroy(); // 기존 인스턴스 파괴 (중복 초기화 방지)
            }
            mySwiper = new Swiper('.swiper', {
                effect: 'cards', // 틴더 같은 카드 효과
                grabCursor: true, // 마우스 커서 손 모양
                pagination: {
                    el: '.swiper-pagination',
                    dynamicBullets: true, // 점이 움직이도록
                },
                // 네비게이션 (필요시 주석 제거)
                // navigation: {
                //   nextEl: '.swiper-button-next',
                //   prevEl: '.swiper-button-prev',
                // },
            });
        }
    </script>
</body>
</html>
