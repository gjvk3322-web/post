<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 회사 익명 신문고 & 포스트잇</title>
    <style>
        body {
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            background-color: #e9ecef; 
            margin: 0; padding: 20px;
            color: #333;
            overflow-x: hidden;
        }
        .header { text-align: center; margin-bottom: 20px; }
        
        /* 🚀 이벤트 게이지(프로그레스 바) 스타일 */
        .event-container {
            max-width: 800px; margin: 0 auto 30px auto;
            background: white; padding: 15px 20px;
            border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        .event-title { font-weight: bold; font-size: 18px; margin-bottom: 10px; color: #e03131; }
        .progress-bg {
            background-color: #f1f3f5; border-radius: 10px;
            height: 25px; width: 100%; overflow: hidden;
            position: relative; box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }
        .progress-bar {
            height: 100%; width: 0%; /* 기본 0%, 자바스크립트로 채움 */
            background: linear-gradient(90deg, #ff8787, #e03131);
            transition: width 0.5s ease-out;
        }
        .progress-text {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: bold; color: #333;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }

        .input-section {
            background: white; max-width: 600px; margin: 0 auto 30px auto;
            padding: 20px; border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        textarea {
            width: 100%; height: 80px; padding: 10px; border: 1px solid #ddd;
            border-radius: 5px; box-sizing: border-box; resize: none; margin-bottom: 15px;
        }
        .controls { display: flex; justify-content: space-between; align-items: center; }
        select, button { padding: 10px 15px; border-radius: 5px; border: 1px solid #ccc; font-weight: bold; }
        button { background-color: #333; color: white; cursor: pointer; border: none; }
        button:hover { background-color: #555; }
        
        /* 📌 겹쳐지는 보드 스타일 */
        .board {
            display: flex; flex-wrap: wrap; justify-content: center;
            max-width: 1000px; margin: 0 auto;
            padding: 20px;
        }
        
        .post-it {
            width: 180px; min-height: 140px; 
            box-shadow: 2px 4px 8px rgba(0,0,0,0.2);
            font-size: 14px; line-height: 1.4; word-break: keep-all;
            position: relative; box-sizing: border-box;
            background-color: white;
            /* 핵심: 서로 겹쳐지게 만드는 마이너스 여백 */
            margin: -15px -10px; 
            z-index: 1;
            /* 터치 시 부드럽게 튀어나오는 애니메이션 */
            transition: transform 0.3s ease, z-index 0s, box-shadow 0.3s ease;
        }

        /* ✨ 마우스 오버 & 터치 시 맨 앞으로 튀어나오는 효과 */
        .post-it:hover, .post-it:active {
            z-index: 100; /* 맨 앞으로 가져오기 */
            transform: scale(1.15) rotate(0deg) !important; /* 크기 키우고 똑바로 세우기 */
            box-shadow: 5px 15px 25px rgba(0,0,0,0.3);
        }

        /* 약간씩 삐뚤어지게 배치 (랜덤한 느낌) */
        .post-it:nth-child(even) { transform: rotate(4deg); }
        .post-it:nth-child(3n) { transform: rotate(-3deg); }
        .post-it:nth-child(5n) { transform: rotate(2deg); }

        /* 카테고리 띠지 및 배경색 */
        .post-it-header {
            width: 100%; height: 25px; padding: 0 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: bold; color: white;
            box-sizing: border-box;
        }
        .post-it-body { padding: 15px; }
        
        .bg-blue { background-color: #74c0fc; } .bg-blue-body { background-color: #d0ebff; }
        .bg-yellow { background-color: #fcc419; } .bg-yellow-body { background-color: #fff3bf; }
        .bg-red { background-color: #ffa8a8; } .bg-red-body { background-color: #ffe3e3; }
        
        .date { font-size: 10px; color: #666; position: absolute; bottom: 8px; right: 10px; }

        /* 📱 모바일 화면 최적화 */
        @media screen and (max-width: 600px) {
            .post-it {
                width: 140px; /* 모바일에서는 포스트잇 크기를 줄여서 많이 보이게 */
                min-height: 120px;
                font-size: 12px;
                margin: -20px -8px; /* 모바일에서 더 촘촘하게 겹침 */
            }
            .post-it-header { font-size: 10px; }
            .input-section { margin: 15px; padding: 15px; }
            .controls { flex-direction: column; gap: 10px; }
            select, button { width: 100%; box-sizing: border-box; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🗣️ 익명 포스트잇 보드</h1>
        <p>우리 회사의 강점, 약점, 시급한 문제점을 자유롭게 적어주세요!</p>
    </div>

    <div class="event-container">
        <div class="event-title">🔥 포스트잇 500개 달성 시 특별 이벤트 진행! 🔥</div>
        <div class="progress-bg">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-text" id="progressText">현재 데이터를 불러오는 중...</div>
        </div>
    </div>

    <div class="input-section">
        <textarea id="memoInput" placeholder="여기에 의견을 자유롭게 적어주세요 (익명 보장!)"></textarea>
        <div class="controls">
            <select id="colorSelect">
                <option value="bg-blue">📘 우리 회사의 강점</option>
                <option value="bg-yellow">📒 보완해야 할 약점</option>
                <option value="bg-red">📕 시급하게 뜯어고칠 문제점</option>
            </select>
            <button id="submitBtn">포스트잇 붙이기</button>
        </div>
    </div>

    <div class="board" id="board">
        </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } 
        from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 👇👇👇 여기에 대표님의 파이어베이스 정보를 덮어써주세요! 👇👇👇
        const firebaseConfig = {
  apiKey: "AIzaSyAjVerxCunFEIvkNfCOTDnedbO5YRVOma4",
  authDomain: "dolbomnote-be438.firebaseapp.com",
  projectId: "dolbomnote-be438",
  storageBucket: "dolbomnote-be438.firebasestorage.app",
  messagingSenderId: "772276336020",
  appId: "1:772276336020:web:b4f2d5659406d813350b81",
  measurementId: "G-232HEJ5RKM"
        };
        // 👆👆👆 ========================================================= 👆👆👆

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const postItsCollection = collection(db, "postits");

        function getCategoryName(colorClass) {
            if (colorClass === 'bg-blue') return '우리 회사의 강점';
            if (colorClass === 'bg-yellow') return '보완해야 할 약점';
            if (colorClass === 'bg-red') return '시급하게 뜯어고칠 문제점';
            return '익명 의견';
        }

        // [기능 1] 포스트잇 추가하기
        document.getElementById('submitBtn').addEventListener('click', async () => {
            const textInput = document.getElementById('memoInput');
            const colorClass = document.getElementById('colorSelect').value;
            const text = textInput.value.trim();

            if (!text) {
                alert("내용을 입력해주세요!");
                return;
            }

            await addDoc(postItsCollection, {
                content: text,
                color: colorClass,
                date: new Date().toLocaleDateString(),
                timestamp: Date.now()
            });

            textInput.value = ''; 
        });

        // [기능 2] 실시간 그리기 + 게이지 업데이트
        const q = query(postItsCollection, orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            const board = document.getElementById('board');
            board.innerHTML = ''; 

            // 🚀 게이지(프로그레스 바) 로직
            const totalCount = snapshot.size; // 현재 작성된 포스트잇 개수
            const targetCount = 500; // 목표 개수
            const percent = Math.min((totalCount / targetCount) * 100, 100); // 100% 넘지 않게

            // 게이지 바 애니메이션 채우기
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressText').innerText = `현재 ${totalCount}개 작성 완료! (${Math.floor(percent)}%) - 목표까지 ${targetCount - totalCount}개 남았습니다!`;

            // 포스트잇 화면에 그리기
            snapshot.forEach((firebaseDoc) => {
                const data = firebaseDoc.data();
                const safeText = data.content.replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, '<br>');
                const categoryName = getCategoryName(data.color);

                const postItHTML = `
                    <div class="post-it ${data.color}-body">
                        <div class="post-it-header ${data.color}">${categoryName}</div>
                        <div class="post-it-body">${safeText}</div>
                        <div class="date">${data.date}</div>
                    </div>
                `;
                board.insertAdjacentHTML('beforeend', postItHTML);
            });
        });
    </script>
</body>
</html>
